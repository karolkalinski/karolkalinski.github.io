<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Charging Sessions</title>
  <style>
    body { font-family: system-ui, -apple-system, Arial, sans-serif; padding: 24px; background: #f7f7fb; color: #111; }
    h1 { font-size: 1.4rem; margin-bottom: 12px; }
    table { border-collapse: collapse; width: 100%; max-width: 800px; background: #fff; box-shadow: 0 2px 6px rgba(20,20,40,0.06); }
    th, td { padding: 10px 12px; border-bottom: 1px solid #eef0f6; text-align: left; }
    th { background: #fbfdff; font-weight: 600; }
    tbody tr:hover { background: #f6f9ff; }
    .small { font-size: 0.9rem; color: #556; }
    .controls { margin: 16px 0; }
    input[type="text"], input[type="number"], input[type="datetime-local"] { padding: 6px 8px; border: 1px solid #d9dee9; border-radius: 6px; }
    button { padding: 8px 10px; border-radius: 8px; border: none; cursor: pointer; background: #2563eb; color: white; }
  </style>
</head>
<body>
  <h1>Charging Sessions</h1>

  <div class="controls">
    <label class="small">Time</label>
    <input id="timeInput" type="datetime-local" />
    <label class="small" style="margin-left:8px">Odometer (km)</label>
    <input id="odoInput" type="number" step="0.1" placeholder="e.g. 12345.6" />
    <label class="small" style="margin-left:8px">kWh</label>
    <input id="kwhInput" type="number" step="0.01" placeholder="e.g. 12.34" />
    <button id="addRowBtn">Add row</button>
    <button id="downloadCsvBtn" style="margin-left:8px;background:#10b981">Download CSV</button>
  </div>

  <table id="sessionsTable" aria-label="Charging sessions table">
    <thead>
      <tr>
        <th>Time</th>
        <th>Odometer</th>
        <th>kWh</th>
      </tr>
    </thead>
    <tbody>
      <!-- sample rows -->
      <tr>
        <td>2025-11-03 08:30</td>
        <td>42,120.5</td>
        <td>12.40</td>
      </tr>
      <tr>
        <td>2025-11-02 17:15</td>
        <td>42,005.2</td>
        <td>8.75</td>
      </tr>
    </tbody>
  </table>

  <script>
    const addRowBtn = document.getElementById('addRowBtn');
    const downloadCsvBtn = document.getElementById('downloadCsvBtn');
    const tableBody = document.querySelector('#sessionsTable tbody');

    addRowBtn.addEventListener('click', () => {
      const time = document.getElementById('timeInput').value;
      const odo = document.getElementById('odoInput').value;
      const kwh = document.getElementById('kwhInput').value;

      if (!time || !odo || !kwh) {
        alert('Please fill all fields.');
        return;
      }

      const row = document.createElement('tr');
      const timeCell = document.createElement('td');
      const odoCell = document.createElement('td');
      const kwhCell = document.createElement('td');

      // format datetime-local to readable string
      const dt = new Date(time);
      const formatted = dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0') + ' ' + String(dt.getHours()).padStart(2,'0') + ':' + String(dt.getMinutes()).padStart(2,'0');

      timeCell.textContent = formatted;
      odoCell.textContent = parseFloat(odo).toLocaleString(undefined, {minimumFractionDigits:0, maximumFractionDigits:1});
      kwhCell.textContent = parseFloat(kwh).toFixed(2);

      row.appendChild(timeCell);
      row.appendChild(odoCell);
      row.appendChild(kwhCell);
      tableBody.prepend(row);

      // clear inputs
      document.getElementById('timeInput').value = '';
      document.getElementById('odoInput').value = '';
      document.getElementById('kwhInput').value = '';
    });

    downloadCsvBtn.addEventListener('click', () => {
      const rows = Array.from(document.querySelectorAll('#sessionsTable tr'));
      const csv = rows.map(r => Array.from(r.querySelectorAll('th,td')).map(cell => '"' + cell.textContent.replace(/"/g,'""') + '"').join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'charging_sessions.csv';
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
